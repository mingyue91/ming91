# Docker 知识卡牌：图鉴收集 + 抽卡
# 通关掉落对应关卡的卡牌；满星/满分额外获得卡包
# 修改卡池只需改这里，前端自动读取

packs:
  # 抽卡权重（百分比，不必凑满 100，代码会归一化）
  weights:
    common: 60
    rare: 30
    epic: 9
    legendary: 1
  # 连续多少次没出史诗，下一次保底史诗及以上
  pity: 10
  # 重复卡转成的碎片数
  fragmentsPerDuplicate: 1
  # 多少个碎片合成一张随机未拥有卡
  fragmentsForCard: 5

items:
  # ---------- 第一章：容器入门 ----------
  - id: "image-container"
    name: "镜像与容器"
    category: "image"
    rarity: "common"
    icon: "🐳"
    lesson: "intro"
    summary: "镜像是只读模板，容器是镜像跑起来的实例。一个镜像可以启动多个互不影响的容器。"
    command: "docker run hello-world"

  - id: "registry"
    name: "镜像仓库"
    category: "image"
    rarity: "common"
    icon: "🏛️"
    lesson: "intro"
    summary: "集中存放镜像的地方，Docker Hub 是最常用的公共仓库，拉取和推送都围绕它进行。"
    command: "docker pull nginx"

  - id: "hello-world"
    name: "hello-world"
    category: "container"
    rarity: "common"
    icon: "👋"
    lesson: "intro"
    summary: "验证安装是否成功的最小镜像：打印一段提示后容器立刻退出，用 ps -a 才能看到。"
    command: "docker run hello-world"

  - id: "docker-group"
    name: "docker 用户组"
    category: "security"
    rarity: "common"
    icon: "🔐"
    lesson: "add-user-to-group"
    summary: "docker 命令通过 /var/run/docker.sock 与守护进程通信，把用户加入 docker 组就能免 sudo。"
    command: "sudo usermod -aG docker $USER"

  - id: "usermod-ag"
    name: "usermod -aG"
    category: "security"
    rarity: "common"
    icon: "➕"
    lesson: "add-user-to-group"
    summary: "-aG 表示追加到附加组，不会覆盖用户已有的组；漏掉 -a 可能把人从其他组里踢出去。"
    command: "sudo usermod -aG docker $USER"

  - id: "newgrp"
    name: "newgrp 切换组"
    category: "security"
    rarity: "rare"
    icon: "🔁"
    lesson: "add-user-to-group"
    summary: "组身份在登录时注入会话，新组要新开会话或执行 newgrp docker 才对当前 shell 生效。"
    command: "newgrp docker"

  - id: "from"
    name: "FROM"
    category: "image"
    rarity: "common"
    icon: "🧱"
    lesson: "dockerfile-basics"
    summary: "Dockerfile 的第一条有效指令，指定基础镜像；多阶段构建里可以给每个阶段起名字。"
    command: "FROM node:20-alpine"

  - id: "workdir"
    name: "WORKDIR"
    category: "image"
    rarity: "common"
    icon: "📂"
    lesson: "dockerfile-basics"
    summary: "设置后续指令的工作目录，目录不存在会自动创建，比 RUN cd 更可靠。"
    command: "WORKDIR /app"

  - id: "dockerignore"
    name: ".dockerignore"
    category: "image"
    rarity: "rare"
    icon: "🚫"
    lesson: "dockerfile-basics"
    summary: "排除不需要进入构建上下文的文件，既能加速构建，也能避免把 .env、.git 打进镜像。"
    command: ".dockerignore"

  - id: "copy-add"
    name: "COPY 与 ADD"
    category: "image"
    rarity: "rare"
    icon: "📋"
    lesson: "dockerfile-reference"
    summary: "官方建议优先 COPY；ADD 额外支持远程 URL 和自动解压本地 tar，行为更隐晦。"
    command: "COPY package.json ./"

  - id: "multi-stage"
    name: "多阶段构建"
    category: "image"
    rarity: "legendary"
    icon: "🏗️"
    lesson: "dockerfile-reference"
    summary: "用多个 FROM 分阶段构建，只把编译产物 COPY --from 到最终镜像，体积能小一个数量级。"
    command: "COPY --from=builder /app/dist ./dist"

  - id: "entrypoint-cmd"
    name: "ENTRYPOINT + CMD"
    category: "image"
    rarity: "epic"
    icon: "🚪"
    lesson: "dockerfile-reference"
    summary: "ENTRYPOINT 固定入口程序，CMD 提供默认参数；docker run 后面的参数会覆盖 CMD 而不是 ENTRYPOINT。"
    command: "ENTRYPOINT [\"node\"]"

  # ---------- 第二章：常用命令 ----------
  - id: "docker-pull"
    name: "docker pull"
    category: "image"
    rarity: "common"
    icon: "⬇️"
    lesson: "docker-image-commands"
    summary: "从仓库拉取镜像到本地，不写标签时默认拉 latest。"
    command: "docker pull nginx:1.27"

  - id: "docker-build-t"
    name: "docker build -t"
    category: "image"
    rarity: "common"
    icon: "🔨"
    lesson: "docker-image-commands"
    summary: "按 Dockerfile 构建镜像并打标签，最后的点表示以当前目录作为构建上下文。"
    command: "docker build -t myapp:1.0 ."

  - id: "docker-rmi"
    name: "docker rmi"
    category: "image"
    rarity: "common"
    icon: "🗑️"
    lesson: "docker-image-commands"
    summary: "删除本地镜像（remove image）；rm 删的是容器，别搞混。镜像被容器引用时会删除失败。"
    command: "docker rmi nginx"

  - id: "docker-ps-a"
    name: "docker ps -a"
    category: "container"
    rarity: "common"
    icon: "📊"
    lesson: "docker-container-commands"
    summary: "ps 只看运行中的容器，加 -a 才会列出所有容器，包括已经退出的。"
    command: "docker ps -a"

  - id: "docker-exec"
    name: "docker exec"
    category: "container"
    rarity: "common"
    icon: "⌨️"
    lesson: "docker-container-commands"
    summary: "在运行中的容器里新起一个进程，常用来进容器排查；退出后容器不受影响。"
    command: "docker exec -it web sh"

  - id: "docker-logs"
    name: "docker logs"
    category: "container"
    rarity: "common"
    icon: "📜"
    lesson: "docker-container-commands"
    summary: "查看容器标准输出，-f 持续跟踪，--tail 只看最后若干行，排障第一步。"
    command: "docker logs -f web"

  - id: "port-mapping"
    name: "-p 端口映射"
    category: "network"
    rarity: "rare"
    icon: "🔌"
    lesson: "docker-run-parameters"
    summary: "格式是「宿主机端口:容器端口」，顺序反了就会连不上，这是最常见的坑之一。"
    command: "docker run -p 8080:80 nginx"

  - id: "detach"
    name: "-d 后台运行"
    category: "container"
    rarity: "common"
    icon: "🌙"
    lesson: "docker-run-parameters"
    summary: "让容器在后台运行，不加 -d 会占用当前终端并附着到容器输出。"
    command: "docker run -d nginx"

  - id: "restart-policy"
    name: "--restart"
    category: "container"
    rarity: "rare"
    icon: "🔁"
    lesson: "docker-run-parameters"
    summary: "设置容器退出后的重启策略，unless-stopped 是生产环境常用的稳妥选择。"
    command: "docker run --restart unless-stopped nginx"

  - id: "bridge"
    name: "bridge 网络"
    category: "network"
    rarity: "common"
    icon: "🌉"
    lesson: "docker-storage-network"
    summary: "默认网络模式，容器通过虚拟网桥与宿主机通信，需要端口映射才能被外部访问。"
    command: "docker network ls"

  - id: "custom-network-dns"
    name: "自定义网络 DNS"
    category: "network"
    rarity: "rare"
    icon: "🧭"
    lesson: "docker-storage-network"
    summary: "自定义网络自带 DNS，同一网络内的容器可以直接用容器名互访，不用记 IP。"
    command: "docker network create appnet"

  - id: "network-connect"
    name: "network connect"
    category: "network"
    rarity: "common"
    icon: "🔗"
    lesson: "docker-storage-network"
    summary: "把已经运行的容器接入某个网络，也可以先 run 时用 --network 直接指定。"
    command: "docker network connect appnet web"

  - id: "named-volume"
    name: "命名卷"
    category: "storage"
    rarity: "common"
    icon: "💾"
    lesson: "docker-volume-bind-mount"
    summary: "由 Docker 统一管理存放位置，跨容器复用，是数据库数据持久化的推荐方式。"
    command: "docker volume create dbdata"

  - id: "bind-mount"
    name: "绑定挂载"
    category: "storage"
    rarity: "common"
    icon: "📁"
    lesson: "docker-volume-bind-mount"
    summary: "把宿主机上的指定路径映射进容器，改代码立刻生效，也方便看日志。"
    command: "docker run -v ./data:/data nginx"

  - id: "volume-ls"
    name: "docker volume ls"
    category: "storage"
    rarity: "common"
    icon: "📦"
    lesson: "docker-volume-bind-mount"
    summary: "列出本机所有卷，配合 inspect 可以查看卷的挂载点和使用情况。"
    command: "docker volume ls"

  - id: "compose-yaml"
    name: "compose.yaml"
    category: "compose"
    rarity: "common"
    icon: "🗂️"
    lesson: "docker-compose-commands"
    summary: "Compose V2 推荐的项目文件名，compose.yaml / compose.yml 都优先，旧名 docker-compose.yml 仍兼容。"
    command: "compose.yaml"

  - id: "compose-up-d"
    name: "compose up -d"
    category: "compose"
    rarity: "common"
    icon: "🚀"
    lesson: "docker-compose-commands"
    summary: "按 compose 文件后台启动整套服务，一条命令拉起多个容器和它们之间的网络。"
    command: "docker compose up -d"

  - id: "compose-down"
    name: "compose down"
    category: "compose"
    rarity: "epic"
    icon: "🧹"
    lesson: "docker-compose-commands"
    summary: "停止并删除整套服务与网络，但默认保留命名卷，数据不会丢。"
    command: "docker compose down"

  - id: "mysql-root-password"
    name: "MYSQL_ROOT_PASSWORD"
    category: "security"
    rarity: "common"
    icon: "🔑"
    lesson: "docker-mysql-deploy"
    summary: "MySQL 官方镜像用它初始化 root 密码，只在数据目录首次初始化时生效。"
    command: "docker run -e MYSQL_ROOT_PASSWORD=root123 mysql:8.0"

  - id: "mysql-datadir"
    name: "/var/lib/mysql"
    category: "storage"
    rarity: "rare"
    icon: "🗄️"
    lesson: "docker-mysql-deploy"
    summary: "MySQL 的数据目录，只有把卷挂到这里，删容器重建后数据才还在。"
    command: "docker run -v mysql-data:/var/lib/mysql mysql:8.0"

  - id: "mysql-port"
    name: "3306 端口"
    category: "network"
    rarity: "common"
    icon: "🔢"
    lesson: "docker-mysql-deploy"
    summary: "MySQL 默认监听 3306，映射到宿主机后客户端才能从外部连进来。"
    command: "docker run -p 3306:3306 mysql:8.0"

  - id: "healthcheck"
    name: "HEALTHCHECK"
    category: "container"
    rarity: "legendary"
    icon: "❤️"
    lesson: "docker-advanced-usage"
    summary: "在 Dockerfile 里声明健康检查命令，编排系统据此判断容器是否真的可用，而不只是进程还活着。"
    command: "HEALTHCHECK --interval=30s CMD curl -f http://localhost/ || exit 1"

  - id: "memory-limit"
    name: "--memory 内存限制"
    category: "container"
    rarity: "rare"
    icon: "🧮"
    lesson: "docker-advanced-usage"
    summary: "限制容器可用内存，避免单个容器 OOM 时把整台宿主机拖垮。"
    command: "docker run --memory=512m nginx"

  - id: "slim-image"
    name: "镜像瘦身"
    category: "image"
    rarity: "epic"
    icon: "🪶"
    lesson: "docker-advanced-usage"
    summary: "多阶段构建 + alpine 基础镜像 + .dockerignore，是三板斧：体积更小、拉取更快、攻击面更小。"
    command: "FROM alpine:3.20"
