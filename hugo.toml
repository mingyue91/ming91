baseURL = "https://mingyue91.github.io/ming91/"
locale = "zh"
title = "min9's Blog"
theme = "stack"

paginate = 10
defaultContentLanguage = "zh"
enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = true

[permalinks]
  page = "/:slug/"

[params]
  description = "min9 的个人博客"
  mainSections = ["posts"]

  copyright = "© 2026 min9"

  [params.dateFormat]
    published = "2006-01-02"
    updated = "2006-01-02"

  [params.footer]
    since = 2026

  [params.opengraph.twitter]
    site = "mingyue91"
    card = "summary_large_image"

  [params.author]
    name = "min9"

  [params.sidebar]
    avatar = "/avatar.jpg"
    subtitle = "二次元 & 技术"

  [params.widgets]
    homepage = [
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

  [params.color]
    scheme = "auto"

[menu]
  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/mingyue91"
    weight = 1
    [menu.social.params]
      Icon = "brand-github"
      newTab = true

  [[menu.social]]
    identifier = "bilibili"
    name = "Bilibili"
    url = "https://space.bilibili.com/1316738338"
    weight = 2
    [menu.social.params]
      Icon = "brand-bilibili"
      newTab = true

  [[menu.social]]
    identifier = "rss"
    name = "RSS"
    url = "/index.xml"
    weight = 3
    [menu.social.params]
      Icon = "rss"
      newTab = true

  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
    [menu.main.params]
      Icon = "home"

  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 2
    [menu.main.params]
      Icon = "archives"

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 3
    [menu.main.params]
      Icon = "user"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# 只保留首页与文章列表的 RSS；标签/分类也各生成一份全文 RSS 只会重复内容
[outputs]
  term = ["HTML"]

# 每个 RSS 只输出最近 10 篇（配合 layouts/rss.xml 的摘要截断）
[services.rss]
  limit = 10
